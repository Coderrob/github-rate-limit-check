name: CI

on:
  push:
    branches: [main, pr-template]
  pull_request:
    branches: [main, pr-template]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck

      - name: Run Tests
        run: bash scripts/run_tests.sh
